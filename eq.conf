# Smart 3-band EQ + stereo spatialiser for SSTuner.
# Loaded by: pipewire -c eq.conf
context.properties = {
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Equalizer"
            media.name       = "Equalizer"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = bass
                        label = bq_lowshelf
                        control = { "Freq" = 120.0 "Q" = 0.7 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = mid
                        label = bq_peaking
                        control = { "Freq" = 1000.0 "Q" = 0.8 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = treble
                        label = bq_highshelf
                        control = { "Freq" = 6000.0 "Q" = 0.7 "Gain" = 0.0 }
                    }
                ]
                links = [
                    { output = "bass:Out" input = "mid:In" }
                    { output = "mid:Out" input = "treble:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "sstuner.eq"
                media.class = Audio/Sink
                node.description = "Equalizer"
                filter.smart = true
                filter.smart.name = "sstuner.eq"
            }
            playback.props = {
                node.name   = "sstuner.eq.out"
                node.passive = true
                media.role = "DSP"
            }
        }
    }
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Spatial"
            media.name       = "Spatial"
            filter.graph = {
                nodes = [
                    { type = builtin name = copyL label = copy }
                    { type = builtin name = copyR label = copy }
                    {
                        type = builtin
                        name = hpL
                        label = bq_highpass
                        control = { "Freq" = 180.0 "Q" = 0.7 }
                    }
                    {
                        type = builtin
                        name = hpR
                        label = bq_highpass
                        control = { "Freq" = 180.0 "Q" = 0.7 }
                    }
                    {
                        type = builtin
                        name = delayL
                        label = delay
                        config = { "max-delay" = 0.04 }
                        control = { "Delay (s)" = 0.0 }
                    }
                    {
                        type = builtin
                        name = delayR
                        label = delay
                        config = { "max-delay" = 0.04 }
                        control = { "Delay (s)" = 0.0 }
                    }
                    {
                        type = builtin
                        name = mixL
                        label = mixer
                        control = {
                            "Gain 1" = 1.0 "Gain 2" = 0.0
                            "Gain 3" = 0.0 "Gain 4" = 0.0
                            "Gain 5" = 0.0 "Gain 6" = 0.0
                            "Gain 7" = 0.0 "Gain 8" = 0.0
                        }
                    }
                    {
                        type = builtin
                        name = mixR
                        label = mixer
                        control = {
                            "Gain 1" = 1.0 "Gain 2" = 0.0
                            "Gain 3" = 0.0 "Gain 4" = 0.0
                            "Gain 5" = 0.0 "Gain 6" = 0.0
                            "Gain 7" = 0.0 "Gain 8" = 0.0
                        }
                    }
                ]
                links = [
                    { output = "copyL:Out" input = "mixL:In 1" }
                    { output = "copyR:Out" input = "hpR:In" }
                    { output = "hpR:Out" input = "delayR:In" }
                    { output = "delayR:Out" input = "mixL:In 2" }
                    { output = "copyR:Out" input = "mixR:In 1" }
                    { output = "copyL:Out" input = "hpL:In" }
                    { output = "hpL:Out" input = "delayL:In" }
                    { output = "delayL:Out" input = "mixR:In 2" }
                ]
                inputs  = [ "copyL:In" "copyR:In" ]
                outputs = [ "mixL:Out" "mixR:Out" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "sstuner.spatial"
                media.class = Audio/Sink
                node.description = "Spatial"
                filter.smart = true
                filter.smart.name = "sstuner.spatial"
            }
            playback.props = {
                node.name   = "sstuner.spatial.out"
                node.passive = true
                media.role = "DSP"
            }
        }
    }
]
